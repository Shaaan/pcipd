[versions]
# AndroidX & Core
coreKtx = "1.16.0"
activityCompose = "1.10.1"
composeBom = "2025.07.00"
firebaseCrashlyticsGradle = "3.0.5"
googleServices = "4.4.3"
gradle = "8.11.1"
navigation = "2.9.2"
browser = "1.8.0"
material = "1.12.0"
annotation = "1.9.1"

# Google & Firebase
perfPlugin = "2.0.0"
playServicesAds = "24.5.0"
firebaseBom = "34.0.0"
# WHAT: Added version for Google Play In-App Review library.
# WHY: Required to use the in-app review API.
# HOW: Defined a version key 'googlePlayReview'.
googlePlayReview = "2.0.2"


# Third Party
shimmer = "1.3.3"
coroutines = "1.10.2"
# WHAT: Added version for Accompanist Navigation Animation.
# WHY: This library provides AnimatedNavHost, which is needed for shared element transitions in Compose.
# HOW: Defined a version key 'accompanist'.
accompanist = "0.36.0"


# Testing
junit = "4.13.2"

# Build Tools & Plugins
androidGradlePlugin = "8.12.0"
kotlin = "2.2.0"
googleServicesPlugin = "4.4.3"
firebaseCrashlyticsPlugin = "3.0.5"
firebasePerfPlugin = "2.0.0"
composeCompiler = "1.5.15"


[libraries]
# AndroidX & Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-navigation-runtime = { group = "androidx.navigation", name = "navigation-runtime-android", version.ref = "navigation" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
firebase-crashlytics-gradle = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsGradle" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-viewbinding = { group = "androidx.compose.ui", name = "ui-viewbinding" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }


# Google & Firebase
google-play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-perf = { group = "com.google.firebase", name = "firebase-perf" }
firebase-remote-config = { group = "com.google.firebase", name = "firebase-config" }
google-play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "googlePlayReview" }
firebase-database = { group = "com.google.firebase", name = "firebase-database" }


# Third Party
google-services = { module = "com.google.gms:google-services", version.ref = "googleServices" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
perf-plugin = { module = "com.google.firebase:perf-plugin", version.ref = "perfPlugin" }
shimmer-compose = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "shimmer" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# WHAT: Added the Accompanist Navigation Animation library definition.
# WHY: Provides AnimatedNavHost for implementing advanced transitions.
# HOW: Created a library alias 'accompanist-navigation-animation'.
accompanist-navigation-animation = { group = "com.google.accompanist", name = "accompanist-navigation-animation", version.ref = "accompanist" }


# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }


[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerfPlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }