plugins {
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.firebase.firebase-perf'
}
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    ndkVersion '27.0.12077973'
    signingConfigs {
        config {
            keyAlias 'Shaaan'
            keyPassword 'cyanogenm0d'
            storeFile file('/Users/shaaan/Downloads/shaaan.jks')
            storePassword 'cyanogenm0d'
        }
    }
    compileSdkVersion 34
    defaultConfig {
        applicationId "in.shaaan.pcipharmd"
        minSdkVersion 28
        targetSdkVersion 34
//        versionCode getVersionCodeTimestamp()
        versionCode 1909301660
        versionName "4.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['en']
        multiDexEnabled true
    }
    buildTypes {
        release {
            ndk {
                debugSymbolLevel = 'full'
            }
            minifyEnabled true
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }

        debug {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }
    namespace 'in.shaaan.pcipharmd'

    externalNativeBuild {
        cmake {
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

def getVersionCodeTimestamp() {
    def date = new Date()
    def formattedDate = date.format('yyMMddHHmm')
    def code = formattedDate.toBigInteger()
    println sprintf("VersionCode: %d", code)
    return code
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.firebase:firebase-perf:21.0.1'
    testImplementation 'junit:junit:4.13.2'

    // App Compat
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.support:multidex:1.0.3'

    // Google
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')

    implementation project(':nativetemplates')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'

    implementation("androidx.datastore:datastore-preferences:1.1.1")

}
