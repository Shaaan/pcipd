plugins {
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.firebase.firebase-perf'
}
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    ndkVersion '27.0.12077973'
    signingConfigs {
        config {
            keyAlias 'Shaaan'
            keyPassword 'cyanogenm0d'
            storeFile file('/Users/shaaan/Downloads/shaaan.jks')
            storePassword 'cyanogenm0d'
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId "in.shaaan.pcipharmd"
        minSdk 29
        targetSdk 36
        //        versionCode getVersionCodeTimestamp()
        versionCode 1909301661
        versionName "4.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['en']
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    buildFeatures{
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    namespace 'in.shaaan.pcipharmd'

    externalNativeBuild {
        cmake {
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
    }
    buildToolsVersion buildToolsVersion
}

kotlin {
    jvmToolchain(21) // Or your desired Java version (e.g., 21)
}

